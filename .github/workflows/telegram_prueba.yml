name: Probar Telegram
# Manda un mensaje de prueba al canal para comprobar que el bot y los secrets están bien. Se corre a mano.
on:
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de prueba
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CANAL" ]; then echo "Faltan los secrets TELEGRAM_TOKEN o TELEGRAM_CANAL"; exit 1; fi
          curl -sS --fail-with-body "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CANAL}" \
            --data-urlencode "text=🧪 Prueba de Quirio Alerta. Si ves este mensaje, los avisos automáticos llegarán a este canal. (No es una alerta real.)" \
            -d disable_web_page_preview=true
