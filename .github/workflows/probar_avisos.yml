name: Probar avisos en el celular
# Manda una notificación de PRUEBA a todos los que activaron avisos en la app. Se corre a mano.
on:
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enviar prueba
        run: python motor/probar_push.py
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
